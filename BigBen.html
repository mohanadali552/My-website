<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIG BEN SALON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15120d; --bg2:#1c170f; --card:#221c14; --card2:#2a2117; --line:#42361f;
  --gold:#c2a05a; --gold-l:#dcc17d; --gold-dim:#7c6535;
  --text:#ede6d6; --text-dim:#b3a58c; --text-dim2:#8a7c62;
  --danger:#d6584f; --danger-bg:#2a1614; --success:#56ad82; --success-bg:#132419;
  --radius:14px; --radius-sm:9px;
  --shadow: 0 8px 24px rgba(0,0,0,.4);
  --bg-glow:#241d12;
  --chrome-bg: rgba(21,18,13,.88);
  --input-bg:#191510;
}
body.light-theme{
  --bg:#f7f2e6; --bg2:#efe6d0; --card:#fffdf8; --card2:#f7f0e0; --line:#e0d2a8;
  --gold:#a8823a; --gold-l:#8a6a1f; --gold-dim:#c2a05a;
  --text:#2a2213; --text-dim:#6e6248; --text-dim2:#8c8168;
  --danger:#b8463c; --danger-bg:#f9e4e1; --success:#256b47; --success-bg:#e2f2e9;
  --shadow: 0 8px 20px rgba(120,100,50,.1);
  --bg-glow:#fdf6e3;
  --chrome-bg: rgba(247,242,230,.92);
  --input-bg:#fffefb;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%) fixed;
  color:var(--text); font-family:'Cairo',Tahoma,Arial,sans-serif;
  min-height:100vh; direction:rtl;
  transition: background-color .2s, color .2s;
}
::selection{background:var(--gold-dim); color:#000;}
input,select,textarea,button{font-family:inherit; direction:rtl;}
button{cursor:pointer;}
a{color:var(--gold-l); text-decoration:none;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- utility ---------- */
.gold-border{border:1px solid var(--line);}
.card{
  background:linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:13px;
}
.btn{
  border:1px solid var(--gold-dim); background:transparent; color:var(--gold-l);
  padding:9px 15px; border-radius:11px; font-weight:600; font-size:13px;
  transition:.15s; display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn:hover{background:rgba(201,162,75,.08);}
.btn-gold{
  background:linear-gradient(180deg, var(--gold-l), var(--gold)); color:#211a0c; border:1px solid var(--gold);
  box-shadow:0 4px 14px rgba(201,162,75,.25);
}
.btn-gold:hover{filter:brightness(1.06);}
.btn-danger{border-color:#7a3a35; color:#e8a29b;}
.btn-danger:hover{background:rgba(224,90,82,.1);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px; font-size:11.5px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
label{font-size:12px; color:var(--text-dim); display:block; margin:0 0 5px;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{
  width:100%; background:var(--input-bg); border:1px solid var(--line); color:var(--text);
  padding:10px 12px; border-radius:10px; font-size:13.5px; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold-dim);}
.field{margin-bottom:12px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.row>.field{flex:1; min-width:140px;}
h1,h2,h3,h4{margin:0; font-weight:800; color:var(--text);}
.eyebrow{color:var(--gold); font-size:12px; letter-spacing:.5px; font-weight:700; margin-bottom:4px;}
.muted{color:var(--text-dim); font-size:12.5px;}
.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; border:1px solid;}
.pill-gold{color:var(--gold-l); border-color:var(--gold-dim); background:rgba(201,162,75,.08);}
.pill-green{color:var(--success); border-color:#2a5c40; background:var(--success-bg);}
.pill-red{color:#e8a29b; border-color:#7a3a35; background:var(--danger-bg);}
.pill-gray{color:var(--text-dim); border-color:var(--line); background:var(--card2);}
.grid{display:grid; gap:12px;}
.divider{height:1px; background:var(--line); margin:12px 0; border:none;}
.icon{width:17px; height:17px; display:inline-block; vertical-align:middle;}
.toast-wrap{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{padding:12px 20px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:var(--shadow); border:1px solid; animation:toastin .2s ease;}
.toast.ok{background:var(--success-bg); color:var(--success); border-color:#2a5c40;}
.toast.err{background:var(--danger-bg); color:#e8a29b; border-color:#7a3a35;}
@keyframes toastin{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
.empty{text-align:center; padding:50px 16px; color:var(--text-dim);}
.empty .icon{width:44px; height:44px; opacity:.5; margin-bottom:10px;}
.loading-spin{width:34px; height:34px; border-radius:50%; border:3px solid #2a2214; border-top-color:var(--gold); animation:spin 1s linear infinite; margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{color:var(--gold); font-size:12px; text-align:right; padding:10px 8px; border-bottom:1px solid var(--line);}
td{padding:11px 8px; border-bottom:1px solid #201a10; color:var(--text);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(2px); z-index:2000; display:flex; align-items:flex-end; justify-content:center; padding:0;}
.modal{background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--gold-dim); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; padding:22px 20px 26px; box-shadow:0 -10px 40px rgba(0,0,0,.6); animation:modalup .18s ease;}
@keyframes modalup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@media(min-width:760px){
  .modal-bg{align-items:center;}
  .modal{border-radius:18px;}
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-close{background:none; border:1px solid var(--line); color:var(--text-dim); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;}

/* ---------- login ---------- */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-box{width:100%; max-width:380px; text-align:center;}
.logo-ph{width:92px; height:92px; border-radius:50%; border:1.5px solid var(--gold-dim); margin:0 auto 18px; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 40% 30%, var(--card2), var(--bg)); position:relative; overflow:hidden;}
.logo-ph img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.logo-ph svg{width:40px; height:40px; opacity:.55;}
.brand-title{font-size:26px; font-weight:900; letter-spacing:1px; color:var(--gold-l); margin-bottom:2px;}
.brand-sub{color:var(--text-dim2); font-size:12px; letter-spacing:3px; margin-bottom:28px;}
.login-error{color:#e8a29b; background:var(--danger-bg); border:1px solid #7a3a35; border-radius:10px; padding:10px; font-size:13px; margin-bottom:14px; display:none;}

/* ---------- shell ---------- */
#app-shell{display:flex; min-height:100vh;}
.sidebar{width:250px; background:linear-gradient(180deg,var(--bg2),var(--bg)); border-left:1px solid var(--line); padding:22px 14px; display:none; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;}
.sb-brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
.sb-brand .logo-ph{width:44px; height:44px; margin:0;}
.sb-brand .logo-ph svg{width:20px; height:20px;}
.sb-name{font-size:15px; font-weight:800; color:var(--gold-l); line-height:1.3;}
.sb-name span{display:block; font-size:10px; color:var(--text-dim2); font-weight:500; letter-spacing:1px;}
.nav-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:11px; color:var(--text-dim); font-size:14px; font-weight:600; border:1px solid transparent;}
.nav-item .icon{width:19px; height:19px; flex-shrink:0;}
.nav-item.active{background:rgba(201,162,75,.1); color:var(--gold-l); border-color:var(--gold-dim);}
.sidebar .nav-item:hover{color:var(--gold-l);}
.sb-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
.sb-user{display:flex; align-items:center; gap:9px; padding:8px; font-size:12.5px; color:var(--text-dim);}
.sb-user b{color:var(--text); display:block; font-size:13.5px;}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--chrome-bg); backdrop-filter:blur(6px); z-index:50; gap:8px;}
.topbar-brand{display:flex; align-items:center; gap:8px; min-width:0;}
.topbar-brand .logo-ph{width:38px; height:38px; margin:0; flex-shrink:0;}
.topbar-brand .logo-ph svg{width:17px;height:17px;}
.topbar-brand-text{display:flex; flex-direction:column; align-items:flex-end; line-height:1.35; min-width:0;}
.topbar-brand-text b{font-size:14px; color:var(--gold-l); white-space:nowrap;}
.topbar-user-line{font-size:10.5px; color:var(--text-dim); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
.topbar-phone{font-size:9.5px; color:var(--text-dim2);}
.topbar-clock{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  text-align:center; line-height:1.3; white-space:nowrap; pointer-events:none; z-index:1;
}
.topbar-clock .tc-date{display:block; font-size:10.5px; color:var(--text-dim); font-weight:600;}
.topbar-clock .tc-time{display:block; font-size:13px; color:var(--gold-l); font-weight:800; margin-top:1px;}
@media(max-width:420px){
  .topbar-clock .tc-date{font-size:9px;}
  .topbar-clock .tc-time{font-size:11.5px;}
}
@media(max-width:360px){
  .topbar-brand-text b{font-size:12.5px;}
  .topbar-user-line{font-size:9.5px;}
  .topbar-phone{font-size:9px;}
  .topbar-brand{gap:6px;}
  .topbar{padding:8px 10px;}
  .topbar-clock .tc-date{font-size:7.5px;}
  .topbar-clock .tc-time{font-size:10px;}
}
main{padding:13px; padding-bottom:92px; flex:1;}
@media(min-width:1180px){
  .sidebar{display:flex;}
  main{padding:26px 32px; padding-bottom:32px;}
  .topbar{display:none;}
}

.page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.hero-welcome{margin-bottom:18px; text-align:right;}
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
@media(min-width:700px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{padding:12px;}
.fin-stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px 12px; margin:12px 0 14px;}
.fin-stat-item{text-align:right;}
.stat-card .icon{width:18px; height:18px; color:var(--gold);}
.stat-val{font-size:19px; font-weight:900; margin-top:6px; color:var(--text);}
.stat-lbl{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.quick-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:14px 0;}
@media(min-width:700px){.quick-grid{grid-template-columns:repeat(5,1fr);}}
.quick-btn{padding:12px 6px; text-align:center; font-size:12px;}
.quick-btn .icon{width:20px;height:20px; margin-bottom:4px; display:block; margin-inline:auto; color:var(--gold);}
.quick-btn-badge{width:48px; height:48px; border-radius:50%; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 8px; line-height:1;}

.bottom-nav{position:fixed; bottom:0; right:0; left:0; background:linear-gradient(180deg,var(--card2),var(--bg)); border-top:1px solid var(--line); display:flex; overflow-x:auto; z-index:100; padding-bottom:env(safe-area-inset-bottom);}
@media(min-width:1180px){.bottom-nav{display:none;}}
.bn-item{flex:1 0 64px; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 2px 10px; color:var(--text-dim2); font-size:10px; font-weight:700; border:none; background:none;}
.bn-item .icon{width:20px; height:20px;}
.bn-item.active{color:var(--gold-l);}

.category-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:5px; margin-bottom:12px;}
.cat-tab{white-space:nowrap; padding:7px 15px; border-radius:18px; border:1px solid var(--line); color:var(--text-dim); font-weight:700; font-size:12.5px; background:var(--card);}
.cat-tab.active{background:linear-gradient(180deg,var(--gold-l),var(--gold)); color:#211a0c; border-color:var(--gold);}

.svc-grid{display:grid; grid-template-columns:1fr; gap:8px;}
@media(min-width:640px){.svc-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1100px){.svc-grid{grid-template-columns:repeat(3,1fr);}}
.svc-card{display:flex; align-items:center; justify-content:space-between; padding:12px;}
.svc-card.selected{border-color:var(--gold); background:rgba(201,162,75,.07);}
.svc-name{font-weight:700; font-size:13.5px;}
.svc-price{color:var(--gold-l); font-weight:800; font-size:12.5px; margin-top:3px;}
.svc-check{width:23px; height:23px; border-radius:50%; border:1.5px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.svc-card.selected .svc-check{background:var(--gold); border-color:var(--gold);}

.list-card{padding:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
.list-card .info{min-width:0;}
.list-card .title-row{font-weight:800; font-size:13.5px; margin-bottom:3px; display:flex; align-items:center; gap:6px;}
.list-card .sub-row{font-size:11.5px; color:var(--text-dim); display:flex; flex-wrap:wrap; gap:8px;}
.list-card .actions{display:flex; gap:5px; flex-shrink:0;}
.iconbtn{width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
.iconbtn:hover{color:var(--gold-l); border-color:var(--gold-dim);}
.iconbtn.danger:hover{color:#e8a29b; border-color:#7a3a35;}

.tab-strip{display:flex; gap:5px; margin-bottom:12px; border-bottom:1px solid var(--line);}
.tab-strip button{flex:1; background:none; border:none; color:var(--text-dim); font-weight:700; font-size:12.5px; padding:8px; border-bottom:2px solid transparent;}
.tab-strip button.active{color:var(--gold-l); border-color:var(--gold);}

.search-box{position:relative; margin-bottom:12px;}
.search-box input{padding-left:34px;}
.search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-dim2);}

.settings-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px;}
.settings-tabs button{white-space:nowrap; padding:7px 13px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text-dim); font-weight:700; font-size:12px;}
.settings-tabs button.active{border-color:var(--gold-dim); color:var(--gold-l); background:rgba(201,162,75,.08);}

.perm-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;}
.perm-item{display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-size:12.5px;}
.perm-item input{width:16px; height:16px; flex-shrink:0;}

.invoice-paper{background:#fbf8f1; color:#1c1608; border:1px solid var(--gold-dim); border-radius:12px; padding:22px;}
.inv-top{text-align:center; margin-bottom:16px;}
.inv-top .logo-ph{width:64px; height:64px; margin:0 auto 8px; border-color:#c9a24b;}
.inv-top b{font-size:19px; letter-spacing:1px; color:#6b5320;}
.inv-meta{display:flex; justify-content:space-between; font-size:12.5px; color:#3d3626; margin:10px 0 14px; flex-wrap:wrap; gap:6px;}
.inv-meta b{color:#1c1608;}
.invoice-paper table{color:#1c1608;}
.invoice-paper th{color:#6b5320; border-color:#d9cba3; font-weight:800;}
.invoice-paper td{border-color:#e6dcbf; color:#1c1608;}
.inv-total-row{display:flex; justify-content:space-between; padding:6px 2px; font-size:14px; color:#1c1608;}
.inv-total-row.grand{font-weight:900; font-size:17px; color:#6b5320; border-top:1px solid #d9cba3; margin-top:6px; padding-top:10px;}
.inv-thanks{text-align:center; margin-top:18px; font-size:13px; color:#4a4433;}

#print-area{display:none;}
@page{ size: A4; margin: 14mm; }
@media print{
  html, body{ min-height:0 !important; height:auto !important; background:#fff !important; }
  body > *{ display:none !important; }
  #print-area{ display:block !important; position:static !important; margin:0 !important; padding:0 !important; }
  #print-area *{ visibility:visible; }
  .invoice-paper{ max-width:100% !important; width:100% !important; margin:0 !important; box-shadow:none !important; }
  .no-print{display:none !important;}
}

.chart-wrap{padding:13px;}
.bars{display:flex; align-items:flex-end; gap:8px; height:150px; margin-top:14px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:flex-end; height:100%;}
.bar{width:100%; max-width:36px; border-radius:6px 6px 0 0; background:linear-gradient(180deg,var(--gold-l),var(--gold-dim)); min-height:3px;}
.bar-lbl{font-size:10.5px; color:var(--text-dim2);}

.top-row-item{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #201a10;}
.top-row-item:last-child{border:none;}
.rank{width:23px; height:23px; border-radius:50%; background:var(--card2); border:1px solid var(--gold-dim); color:var(--gold-l); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}

.confirm-box{max-width:360px; text-align:center;}
.confirm-icon{width:46px; height:46px; margin:0 auto 12px; color:#e8a29b;}
.ltr-num{direction:ltr; unicode-bidi:embed; display:inline-block;}
</style>
</head>
<body>

<div id="toast-wrap" class="toast-wrap"></div>
<div id="modal-root"></div>
<div id="print-area"></div>

<div id="login-screen">
  <div class="login-box">
    <div class="logo-ph" id="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7l4 10h8l4-10M4 7l2-3h12l2 3M4 7h16"/></svg>
    </div>
    <div class="brand-title">BIG BEN SALON</div>
    <div class="brand-sub">نظام إدارة الصالون</div>
    <div id="session-checking" class="loading-spin"></div>
    <div id="login-form-wrap" class="hidden">
      <div class="card" style="text-align:right;">
        <div id="login-error" class="login-error"></div>
        <div class="field">
          <label>اسم المستخدم</label>
          <input type="text" id="login-user" placeholder="اسم المستخدم" autocomplete="username">
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-gold btn-block" id="login-btn" onclick="Auth.login()">دخول</button>
      </div>
      <div class="muted ltr-num" style="margin-top:16px;">091 234 6815</div>
    </div>
  </div>
</div>

<div id="app-shell" class="hidden">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-col">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="logo-ph" id="topbar-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7l4 10h8l4-10M4 7l2-3h12l2 3M4 7h16"/></svg></div>
        <div class="topbar-brand-text">
          <b>BIG BEN SALON</b>
          <div class="topbar-user-line" id="topbar-user-line"></div>
          <div class="topbar-phone ltr-num" id="topbar-phone"></div>
        </div>
      </div>

      categories: (catsR.data||[]).map(c=>({id:c.id, name:c.name})),

function errMsg(e){
  try{
    if(!e) return 'خطأ غير معروف';
    if(typeof e === 'string') return e;
    if(e.message) return e.message + (e.hint? ' — '+e.hint : '') + (e.details? ' ('+e.details+')' : '');
    if(e.error_description) return e.error_description;
    const s = JSON.stringify(e);
    return s === '{}' ? String(e) : s;
  }catch(_){ return String(e); }
}

    if(data.appointments?.length) await sb.from('appointments').insert(data.appointments.map(a=>({id:a.id, customer_id:a.customerId, customer_name:a.customerName, phone:a.phone, appt_date:a.date, appt_time:a.time, employee_id:a.employeeId, employee_name:a.employeeName, service_names:a.serviceNames, notes:a.notes, status:a.status})));
    if(data.expenses?.length) await sb.from('expenses').insert(data.expenses.map(e=>({id:e.id, type:e.type, description:e.description, amount:e.amount, expense_date:e.date, employee_id:e.employeeId, employee_name:e.employeeName, notes:e.notes})));
    if(data.invoices?.length) await sb.from('invoices').insert(data.invoices.map(i=>({id:i.id, number:i.number, invoice_date:i.date, customer_id:i.customerId, customer_name:i.customerName, customer_phone:i.customerPhone, employee_id:i.employeeId, employee_name:i.employeeName, discount:i.discount, total:i.total, payment_method:i.paymentMethod, bank_type:i.bankType||null, transaction_number:i.transactionNumber||null, employee_commission_rate:i.commissionRate||0, status:i.status})));
    const itemRows = [];

    if(data.settings) await sb.from('settings').update({name:data.settings.name, phone:data.settings.phone, logo_url:data.settings.logo}).eq('id',1);
  }
};

/* ---------------- Auth & Permissions ---------------- */
const SESSION_KEY = 'bigben_session_token';
const SESSION_DAYS = 30;
function genToken(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID()+crypto.randomUUID();
  return 'sess-'+Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
}
const Auth = {
  async login(){
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    const errBox = document.getElementById('login-error');
    errBox.style.display='none';
    if(!u || !p){ errBox.textContent='الرجاء إدخال اسم المستخدم وكلمة المرور'; errBox.style.display='block'; return; }
    const btn = document.getElementById('login-btn'); btn.disabled=true; btn.textContent='جارٍ الدخول...';
    await new Promise(r=>setTimeout(r,250));
    const user = DB.users.find(x=>x.username===u);
    btn.disabled=false; btn.textContent='دخول';
    if(!user || user.password !== p){ errBox.textContent='اسم المستخدم أو كلمة المرور غير صحيحة'; errBox.style.display='block'; return; }
    if(!user.active){ errBox.textContent='تم تعطيل هذا الحساب، الرجاء مراجعة المدير'; errBox.style.display='block'; return; }
    CUR = user;
    try{
      const token = genToken();
      const expiresAt = new Date(Date.now()+SESSION_DAYS*24*3600*1000).toISOString();
      const {error} = await sb.from('sessions').insert({token, user_id:user.id, expires_at:expiresAt});
      if(!error) localStorage.setItem(SESSION_KEY, token);
    }catch(e){ console.error('Failed to create session:', e); } // login still proceeds even if session persistence fails
    await Sup.logAudit('تسجيل الدخول');
    UI.enterApp();
  },
  logout(){
    confirmDialog('تسجيل الخروج','هل تريد تسجيل الخروج من التطبيق؟', async ()=>{
      const token = localStorage.getItem(SESSION_KEY);
      if(token){
        try{ await sb.from('sessions').delete().eq('token', token); }catch(e){ console.error('Failed to invalidate session:', e); }
        localStorage.removeItem(SESSION_KEY);
      }
      CUR = null;
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('login-user').value='';
      document.getElementById('login-pass').value='';
    }, false);
  },
  async tryRestoreSession(){
    const token = localStorage.getItem(SESSION_KEY);
    if(!token) return false;
    try{
      const {data,error} = await sb.from('sessions').select('*').eq('token', token).maybeSingle();
      if(error || !data){ localStorage.removeItem(SESSION_KEY); return false; }
      if(new Date(data.expires_at) < new Date()){
        try{ await sb.from('sessions').delete().eq('token', token); }catch(_){}
        localStorage.removeItem(SESSION_KEY);
        return false;
      }
      const user = DB.users.find(u=>u.id===data.user_id);
      if(!user || !user.active){ localStorage.removeItem(SESSION_KEY); return false; }
      CUR = user;
      return true;
    }catch(e){ console.error('Failed to restore session:', e); return false; }
  },
  hasPerm(key){
    if(!CUR) return false;
    if(CUR.role==='admin') return true;
    return CUR.permissions.includes(key);
  }
};

Pages.issueInvoice = async function(){
  const name = document.getElementById('ns-customer').value.trim();
  const phone = document.getElementById('ns-phone').value.trim();
  const employeeId = document.getElementById('ns-employee').value;
  const pay = document.getElementById('ns-pay').value;
  const discount = Number(document.getElementById('ns-discount').value)||0;
  if(PAGE_STATE.chosen.length===0){ toast('اختر خدمة واحدة على الأقل','err'); return; }
  const emp = (DB.staffList||[]).find(s=>s.id===employeeId);
  if(!emp){ toast('اختر اسم الموظف، أو أضف موظفًا من الإعدادات أولاً','err'); return; }
  let bankType = null, txnNumber = null;
  if(pay==='بنك'){
    bankType = document.getElementById('ns-banktype').value;
    if(!bankType){ toast('اختر نوع البنك / وسيلة الدفع','err'); return; }
    txnNumber = document.getElementById('ns-txn').value.trim();
    if(!txnNumber){ toast('أدخل رقم العملية','err'); return; }
  }
  try{
    let cust = null;
    if(phone){
      cust = DB.customers.find(c=>c.phone===phone);
      if(!cust){ cust = await Sup.insertCustomer({name: name||'', phone}); DB.customers.push(cust); }
      else if(name && cust.name!==name){ await Sup.updateCustomer(cust.id, {name}); cust.name = name; }
    }
    const total = Math.max(0, PAGE_STATE.chosen.reduce((s,c)=>s+c.price*c.qty,0) - discount);
    const items = PAGE_STATE.chosen.map(c=>({name:c.name, price:c.price, qty:c.qty}));
    const invData = {date:new Date().toISOString(), customerId: cust? cust.id : null, customerName: cust? cust.name : (name||null), customerPhone: cust? cust.phone : (phone||null),
      employeeId: emp.id, employeeName: emp.name, items, discount, total, paymentMethod:pay, bankType, transactionNumber:txnNumber, commissionRate: emp.commissionRate||0, status:'مكتملة'};
    const {id:invId, number} = await Sup.insertInvoiceWithNumber(invData);
    const inv = {id:invId, number, ...invData};
    DB.invoices.push(inv);
    await Sup.logAudit('إنشاء فاتورة '+number);
    PAGE_STATE = {};
    toast('تم إصدار الفاتورة بنجاح');
    Pages.openInvoice(inv.id);
  }catch(e){ console.error(e); toast('تعذر إصدار الفاتورة، حاول مرة أخرى: '+errMsg(e),'err'); }
};

function periodLabel(f){ return {today:'اليوم', yesterday:'أمس', week:'هذا الأسبوع', month:'هذا الشهر', custom:'فترة مخصصة'}[f]; }
function filterByPeriod(arr, f, from, to){
  const now = new Date();
  const d0 = new Date(); d0.setHours(0,0,0,0);
  if(f==='today') return arr.filter(x=>x.date.slice(0,10)===todayStr());
  if(f==='yesterday'){ const y=new Date(); y.setDate(y.getDate()-1); const ys=y.toISOString().slice(0,10); return arr.filter(x=>x.date.slice(0,10)===ys); }
  if(f==='week'){ const w=new Date(d0); w.setDate(w.getDate()-7); return arr.filter(x=>new Date(x.date)>=w); }
  if(f==='month'){ const m=new Date(d0); m.setDate(m.getDate()-30); return arr.filter(x=>new Date(x.date)>=m); }
  if(f==='custom' && from && to){ return arr.filter(x=> x.date.slice(0,10)>=from && x.date.slice(0,10)<=to); }
  return arr;
}

function buildDayBuckets(filter, from, to){
  const today = new Date(); today.setHours(0,0,0,0);
  let start, end;
  if(filter==='today'){ end=new Date(today); start=new Date(today); start.setDate(start.getDate()-6); }
  else if(filter==='week'){ end=new Date(today); start=new Date(today); start.setDate(start.getDate()-6); }
  else if(filter==='month'){ end=new Date(today); start=new Date(today); start.setDate(start.getDate()-29); }
  else if(filter==='custom' && from && to){ start=new Date(from); end=new Date(to); }
  else { end=new Date(today); start=new Date(today); start.setDate(start.getDate()-6); }
  const days = [];
  let cur = new Date(start);
  while(cur<=end && days.length<60){ days.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
  if(days.length===0) days.push(today.toISOString().slice(0,10));
  return days;
}
function fmtAxisVal(val){
  if(val>=1000000) return (val%1000000===0? val/1000000 : (val/1000000).toFixed(1))+'M';
  if(val>=1000) return Math.round(val/1000)+'k';
  return String(val);
}
function buildFinanceChartSVG(days, revs, exps){
  const W=680, H=230, padL=54, padR=16, padT=20, padB=30;
  const maxV = Math.max(...revs, ...exps, 1);
  const x = i => padL + (i/(Math.max(days.length-1,1)))*(W-padL-padR);
  const y = v => padT + (1-(v/maxV))*(H-padT-padB);
  const pathOf = arr => arr.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const dotsOf = (arr,color) => arr.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const val = Math.round(maxV*f);
    const yy = y(val);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#e6dcbf" stroke-width="1"/><text x="${padL-8}" y="${yy+3.5}" font-size="10" fill="#8a7f66" text-anchor="end">${fmtAxisVal(val)}</text>`;
  }).join('');
  const step = Math.max(1, Math.ceil(days.length/6));
  const labels = days.map((d,i)=> i%step===0 || i===days.length-1 ? `<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9" fill="#8a7f66" text-anchor="middle">${d.slice(5)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block; background:#fbf8f1; border-radius:10px; direction:ltr;" direction="ltr">
    ${gridLines}
    <path d="${pathOf(exps)}" fill="none" stroke="#d6584f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${pathOf(revs)}" fill="none" stroke="#c9a24b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dotsOf(exps,'#d6584f')}
    ${dotsOf(revs,'#c9a24b')}
    ${labels}
  </svg>`;
}

Pages.downloadBackup = function(){

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'bigben-salon-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تنزيل النسخة الاحتياطية');
};
Pages.restoreBackup = function(input){
  const file = input.files[0]; if(!file) return;
  confirmDialog('استعادة نسخة احتياطية','سيتم استبدال جميع البيانات الحالية في قاعدة البيانات بالبيانات الموجودة في الملف. هل تريد المتابعة؟', ()=>{
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data.settings || !data.users) throw new Error('bad file');
        toast('جارٍ الاستعادة، قد يستغرق ذلك بضع ثوانٍ...');
        await Sup.restoreAll(data);
        await loadDB();
        await Sup.logAudit('استعادة نسخة احتياطية');
        toast('تمت الاستعادة بنجاح'); UI.renderShell();
      }catch(e){ console.error(e); toast('ملف النسخة الاحتياطية غير صالح أو تعذرت الاستعادة: '+errMsg(e),'err'); }
    };
    reader.readAsText(file);
  }, false);
};

Modals.onEditPayChange = function(v){
  const bankWrap = document.getElementById('ei-banktype-wrap');
  const txnWrap = document.getElementById('ei-txn-wrap');
  if(v==='بنك'){ bankWrap.classList.remove('hidden'); }
  else{ bankWrap.classList.add('hidden'); txnWrap.classList.add('hidden'); }
};
Modals.onEditBankTypeChange = function(v){
  const txnWrap = document.getElementById('ei-txn-wrap');
  if(v){ txnWrap.classList.remove('hidden'); } else { txnWrap.classList.add('hidden'); }
};
Modals.saveEditInvoice = async function(id){
  const inv = DB.invoices.find(i=>i.id===id); if(!inv) return;
  const name = document.getElementById('ei-name').value.trim();
  const phone = document.getElementById('ei-phone').value.trim();
  const pay = document.getElementById('ei-pay').value;
  let bankType=null, txnNumber=null;
  if(pay==='بنك'){
    bankType = document.getElementById('ei-banktype').value;
    if(!bankType){ toast('اختر نوع البنك / وسيلة الدفع','err'); return; }
    txnNumber = document.getElementById('ei-txn').value.trim();
    if(!txnNumber){ toast('أدخل رقم العملية','err'); return; }
  }
  try{
    const fields = {customerName:name||null, customerPhone:phone||null, paymentMethod:pay, bankType, transactionNumber:txnNumber};
    await Sup.updateInvoiceDetails(id, fields);
    Object.assign(inv, fields);
    await Sup.logAudit('تعديل فاتورة '+inv.number);
    UI.closeModal(); toast('تم حفظ التعديلات'); UI.renderPage();
  }catch(e){ console.error(e); toast('تعذر حفظ التعديلات: '+errMsg(e),'err'); }
};

function timeOptions(selected){
  let out = '';
  for(let h=8; h<=23; h++){

      const val = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      out += `<option value="${val}" ${selected===val?'selected':''}>${val}</option>`;
    }
  }
  return out;
}

Modals.apptToggleService = function(serviceId){
  const idx = APPT_STATE.chosen.findIndex(c=>c.serviceId===serviceId);
  if(idx>=0){
    APPT_STATE.chosen.splice(idx,1);
    delete APPT_STATE.sessionsByService[serviceId];
  }else{
    const s = DB.services.find(x=>x.id===serviceId);
    APPT_STATE.chosen.push({serviceId:s.id, name:s.name, price:s.price});
    if((s.sessions||1) > 1){
      APPT_STATE.sessionsByService[serviceId] = [...Array(s.sessions)].map(()=>({date:'',time:''}));
    }
  }
  Modals.renderApptModal();
};
Modals.apptSetSession = function(serviceId, index, field, value){

  APPT_STATE.sessionsByService[serviceId][index][field] = value;
};

Modals.saveApptNew = async function(){
  const st = APPT_STATE;
  const name = st.custName.trim();
  const phone = st.custPhone.trim();
  if(!st.employeeId){ toast('اختر الموظف','err'); return; }
  if(st.chosen.length===0){ toast('اختر خدمة واحدة على الأقل','err'); return; }
  const emp = (DB.staffList||[]).find(s=>s.id===st.employeeId);
  if(!emp){ toast('الموظف المختار غير موجود','err'); return; }

  const multiServices = st.chosen.filter(c=>{ const svc=DB.services.find(x=>x.id===c.serviceId); return svc && (svc.sessions||1) > 1; });
  let primaryDate, primaryTime, sessionsData = null;

  if(multiServices.length>0){
    sessionsData = [];
    for(const c of multiServices){
      const svc = DB.services.find(x=>x.id===c.serviceId);
      const sessions = st.sessionsByService[c.serviceId] || [];
      for(let i=0;i<(svc.sessions||1);i++){
        if(!sessions[i] || !sessions[i].date || !sessions[i].time){
          toast(`أدخل تاريخ ووقت الجلسة ${ordinalLabel(i)} لخدمة "${svc.name}"`,'err');
          return;
        }
      }
      sessionsData.push({serviceId:c.serviceId, serviceName:svc.name, sessions:sessions.slice(0, svc.sessions||1)});
    }
    primaryDate = sessionsData[0].sessions[0].date;
    primaryTime = sessionsData[0].sessions[0].time;
  }else{
    if(!st.baseDate || !st.baseTime){ toast('أدخل التاريخ والوقت','err'); return; }
    primaryDate = st.baseDate; primaryTime = st.baseTime;
  }

  const conflict = DB.appointments.find(a=> a.id!==st.editId && a.employeeId===st.employeeId && a.date===primaryDate && a.time===primaryTime && a.status!=='ملغي');
  if(conflict){ toast('يوجد حجز آخر لنفس الموظف في هذا الوقت','err'); return; }

  const serviceNames = st.chosen.map(c=>c.name).join('، ');
  const total = st.chosen.reduce((s,c)=>s+c.price,0);

  try{
    const payload = {
      customerId: null,
      customerName: name||null,
      phone: phone||null,
      date: primaryDate, time: primaryTime,
      employeeId: emp.id, employeeName: emp.name,
      serviceNames, items: st.chosen, total, sessionsData,
      notes: st.notes.trim()
    };

    if(st.editId){
      await Sup.updateAppointment(st.editId, payload);
      const a = DB.appointments.find(x=>x.id===st.editId);
      Object.assign(a, payload);
      await Sup.logAudit('تعديل حجز: '+(payload.customerName||'بدون اسم'));
    }else{
      payload.status = 'قادم';
      const newId = await Sup.insertAppointment(payload);
      DB.appointments.push({id:newId, ...payload});
      await Sup.logAudit('حجز جديد: '+(payload.customerName||'بدون اسم'));
    }
    APPT_STATE = null;
    UI.closeModal(); toast('تم حفظ الحجز'); UI.renderPage();
  }catch(e){ console.error(e); toast('تعذر حفظ الحجز: '+errMsg(e),'err'); }
};

Modals.confirmApptInvoice = async function(apptId){
  const a = DB.appointments.find(x=>x.id===apptId);
  if(!a) return;
  if(a.invoiceId){ toast('تم إصدار فاتورة لهذا الحجز بالفعل','err'); UI.closeModal(); return; }
  const pay = document.getElementById('ai-pay').value;
  let bankType=null, txnNumber=null;
  if(pay==='بنك'){
    bankType = document.getElementById('ai-banktype').value;
    if(!bankType){ toast('اختر نوع البنك / وسيلة الدفع','err'); return; }
    txnNumber = document.getElementById('ai-txn').value.trim();
    if(!txnNumber){ toast('أدخل رقم العملية','err'); return; }
  }
  let emp = (DB.staffList||[]).find(s=>s.id===a.employeeId);
  if(!emp) emp = (DB.staffList||[]).find(s=>s.name===a.employeeName);
  if(!emp) emp = {id:a.employeeId, name:a.employeeName, commissionRate:0};
  try{
    const items = (a.items&&a.items.length)? a.items.map(it=>({name:it.name, price:it.price, qty:it.qty||1})) : [{name:a.serviceNames||'خدمة', price:a.total||0, qty:1}];
    const invData = {
      date: new Date().toISOString(),
      customerId: a.customerId||null, customerName: a.customerName||null, customerPhone: a.phone||null,
      employeeId: emp.id, employeeName: emp.name,
      items, discount:0, total: a.total||0,
      paymentMethod: pay, bankType, transactionNumber: txnNumber,
      commissionRate: emp.commissionRate||0, status:'مكتملة'
    };
    const {id:invId, number} = await Sup.insertInvoiceWithNumber(invData);
    const inv = {id:invId, number, ...invData};
    DB.invoices.push(inv);
    await Sup.linkAppointmentInvoice(apptId, invId);
    a.invoiceId = invId;
    await Sup.logAudit('إصدار فاتورة من حجز: '+number);
    UI.closeModal();
    toast('تم إصدار الفاتورة بنجاح');
    Pages.openInvoice(invId);
  }catch(e){ console.error(e); toast('تعذر إصدار الفاتورة: '+errMsg(e),'err'); }
};

Modals.addExpenseType = async function(){
  const input = document.getElementById('e-newtype');
  const name = input.value.trim();
  if(!name){ toast('أدخل اسم نوع المصروف','err'); return; }

    toast('هذا النوع موجود بالفعل','err');

  try{

    const sel = document.getElementById('e-type');
    if(sel){
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
      sel.value = name;
    }
    input.value = '';
    toast('تمت إضافة النوع');
  }catch(e){
    if(e && e.code==='23505'){ toast('هذا النوع موجود بالفعل','err'); }

};
Modals.saveExpense = async function(){
  const type = document.getElementById('e-type').value;
  const description = document.getElementById('e-desc').value.trim();
  const amount = Number(document.getElementById('e-amount').value);
  const employeeId = document.getElementById('e-emp').value;
  const date = document.getElementById('e-date').value;
  const time = document.getElementById('e-time').value;
  const notes = document.getElementById('e-notes').value.trim();
  if(!type){ toast('اختر نوع المصروف','err'); return; }
  if(!description){ toast('أدخل وصف المصروف','err'); return; }
  if(!amount || amount<=0){ toast('أدخل مبلغًا صحيحًا','err'); return; }
  const emp = (DB.staffList||[]).find(s=>s.id===employeeId);
  if(!emp){ toast('اختر الموظف الذي سجل المصروف، أو أضف موظفًا من الإعدادات أولاً','err'); return; }
  if(!date){ toast('أدخل التاريخ','err'); return; }
  try{
    const newExp = {type, description, amount, date, time, employeeId:emp.id, employeeName:emp.name, notes};
    const newId = await Sup.insertExpense(newExp);
    DB.expenses.push({id:newId, ...newExp});
    await Sup.logAudit('إضافة مصروف: '+type+' ('+fmtMoney(amount)+')');
    UI.closeModal(); toast('تم إضافة المصروف'); UI.renderPage();
  }catch(e){ console.error(e); toast('تعذر إضافة المصروف: '+errMsg(e),'err'); }
};

Modals.categoryForm = function(id){
  const c = id? DB.categories.find(x=>x.id===id) : null;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)UI.closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>${c?'تعديل التصنيف':'تصنيف جديد'}</h3><button class="modal-close" onclick="UI.closeModal()">${ic('x')}</button></div>
      <div class="field"><label>اسم التصنيف</label><input type="text" id="cat-name" value="${c?c.name:''}"></div>
      <button class="btn btn-gold btn-block" onclick="Modals.saveCategory('${id||''}')">حفظ</button>
    </div>
  </div>`;
};
Modals.saveCategory = async function(id){
  const name = document.getElementById('cat-name').value.trim();
  if(!name){ toast('أدخل اسم التصنيف','err'); return; }
  try{
    if(id){
      await Sup.updateCategory(id, name);
      DB.categories.find(c=>c.id===id).name = name;
      await Sup.logAudit('تعديل تصنيف: '+name);
    }else{
      const newId = await Sup.insertCategory(name);
      DB.categories.push({id:newId, name});
      PAGE_STATE.svcCat = newId;
      await Sup.logAudit('إضافة تصنيف: '+name);
    }
    UI.closeModal(); toast('تم الحفظ'); UI.renderPage();
  }catch(e){ console.error(e); toast('تعذر حفظ التصنيف: '+errMsg(e),'err'); }
};

Modals.serviceForm = function(id, catId){
  const s = id? DB.services.find(x=>x.id===id) : null;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)UI.closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>${s?'تعديل خدمة':'خدمة جديدة'}</h3><button class="modal-close" onclick="UI.closeModal()">${ic('x')}</button></div>
      <div class="field"><label>التصنيف</label><select id="svc-cat">${DB.categories.map(c=>`<option value="${c.id}" ${((s?s.categoryId:catId)===c.id)?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label>اسم الخدمة</label><input type="text" id="svc-name" value="${s?s.name:''}"></div>
      <div class="field"><label>السعر (${DB.settings.currency})</label><input type="number" id="svc-price" min="0" value="${s?s.price:''}"></div>
      <div class="field"><label>عدد الجلسات</label><input type="number" id="svc-sessions" min="1" value="${s?(s.sessions||1):1}"></div>
      <p class="muted" style="margin-bottom:14px;">اتركها 1 للخدمات العادية. أي رقم أكبر من 1 يجعل هذه الخدمة تطلب مواعيد جلسات متعددة عند الحجز (مثل باقات تجهيز العرسان).</p>

Modals.saveService = async function(id){
  const categoryId = document.getElementById('svc-cat').value;
  const name = document.getElementById('svc-name').value.trim();
  const price = Number(document.getElementById('svc-price').value);
  const sessions = Math.max(1, Number(document.getElementById('svc-sessions').value)||1);
  if(!name || !price || price<=0){ toast('الرجاء إدخال بيانات صحيحة','err'); return; }
  try{
    if(id){
      await Sup.updateService(id, {categoryId,name,price,sessions});
      const s=DB.services.find(x=>x.id===id); Object.assign(s,{categoryId,name,price,sessions});
      await Sup.logAudit('تعديل خدمة: '+name);
    }else{
      const newId = await Sup.insertService({categoryId,name,price,sessions});
      DB.services.push({id:newId, categoryId, name, price, sessions, active:true});
      await Sup.logAudit('إضافة خدمة: '+name);
    }
    UI.closeModal(); toast('تم الحفظ'); UI.renderPage();
  }catch(e){ console.error(e); toast('تعذر حفظ الخدمة: '+errMsg(e),'err'); }
};

Modals.employeeForm = function(id){
  const u = id? DB.users.find(x=>x.id===id) : null;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)UI.closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>${u?'تعديل موظف':'إضافة موظف'}</h3><button class="modal-close" onclick="UI.closeModal()">${ic('x')}</button></div>
      <div class="field"><label>الاسم الكامل</label><input type="text" id="emp-name" value="${u?u.name:''}"></div>
      <div class="field"><label>اسم المستخدم</label><input type="text" id="emp-user" value="${u?u.username:''}" ${u?'disabled':''}></div>
      <div class="field"><label>${u?'كلمة مرور جديدة (اختياري)':'كلمة المرور'}</label><input type="password" id="emp-pass" placeholder="${u?'اتركها فارغة لعدم التغيير':''}"></div>
      <label>الصلاحيات</label>
      <div class="perm-grid">
        ${PERMS.map(p=>`<label class="perm-item"><input type="checkbox" value="${p.key}" ${u&&u.permissions.includes(p.key)?'checked':''}> ${p.label}</label>`).join('')}
      </div>
      <button class="btn btn-gold btn-block" style="margin-top:16px;" onclick="Modals.saveEmployee('${id||''}')">حفظ</button>
    </div>
  </div>`;
};
Modals.saveEmployee = async function(id){
  const name = document.getElementById('emp-name').value.trim();
  const username = document.getElementById('emp-user').value.trim();
  const pass = document.getElementById('emp-pass').value;
  const perms = [...document.querySelectorAll('.perm-item input:checked')].map(i=>i.value);
  if(!name || !username){ toast('الرجاء إدخال جميع البيانات','err'); return; }
  try{
    if(id){
      const patch = {name, permissions:perms}; if(pass) patch.password = pass;
      await Sup.updateUser(id, patch);
      const u = DB.users.find(x=>x.id===id);
      u.name = name; u.permissions = perms; if(pass) u.password = pass;
      await Sup.logAudit('تعديل موظف: '+name);
    }else{
      if(DB.users.filter(u=>u.role==='employee').length>=5){ toast('الحد الأقصى 5 موظفين','err'); return; }
      if(DB.users.some(u=>u.username===username)){ toast('اسم المستخدم موجود مسبقًا','err'); return; }
      if(!pass){ toast('الرجاء إدخال كلمة مرور','err'); return; }
      const newId = await Sup.insertUser({username, password:pass, name, permissions:perms});
      DB.users.push({id:newId, username, password:pass, name, role:'employee', permissions:perms, active:true});
      await Sup.logAudit('إضافة موظف: '+name);
    }
    UI.closeModal(); toast('تم الحفظ'); UI.renderShell();
  }catch(e){ console.error(e); toast('تعذر حفظ بيانات الموظف: '+errMsg(e),'err'); }
};

Modals.employeeInvoices = function(staffId){
  const staff = (DB.staffList||[]).find(s=>s.id===staffId);
  if(!staff) return;
  const invs = periodInvoices('empRep').filter(i=>i.employeeId===staffId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total = invs.reduce((s,i)=>s+i.total,0);
  const commission = invs.reduce((s,i)=>s+(i.total*(i.commissionRate||0)/100),0);
  const f = PAGE_STATE.empRep || 'today';
  const periodTxt = f==='custom' ? `${PAGE_STATE.empRepFrom||'؟'} → ${PAGE_STATE.empRepTo||'؟'}` : periodLabel(f);
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)UI.closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>فواتير ${staff.name}</h3><button class="modal-close" onclick="UI.closeModal()">${ic('x')}</button></div>
      <div class="muted" style="margin-bottom:12px;">الفترة: ${periodTxt}</div>
      <div class="stat-grid" style="grid-template-columns:1fr 1fr; margin-bottom:10px;">
        <div class="card stat-card"><div class="stat-val">${invs.length}</div><div class="stat-lbl">عدد الفواتير</div></div>
        <div class="card stat-card"><div class="stat-val">${fmtMoney(total)}</div><div class="stat-lbl">إجمالي العمل</div></div>
      </div>
      <div class="card stat-card" style="margin-bottom:16px; border-color:var(--gold-dim);"><div class="stat-val" style="color:var(--gold-l);">${fmtMoney(commission)}</div><div class="stat-lbl">المبلغ المستحق للموظف</div></div>
      ${invs.length===0? `<div class="muted">لا توجد فواتير لهذا الموظف في هذه الفترة.</div>` :
      invs.map(i=>`
      <div class="list-card" style="cursor:pointer;" onclick="UI.closeModal(); Pages.openInvoice('${i.id}')">
        <div class="info">
          <div class="title-row">${i.number} ${i.status==='ملغاة'?'<span class="pill pill-red">ملغاة</span>':''}<span class="pill pill-gray">${i.paymentMethod}${i.bankType?(' - '+i.bankType):''}</span></div>
          <div class="sub-row"><span>${i.customerName||'غير مسجل'}</span><span>${fmtDateTime(i.date)}</span></div>
          <div class="muted" style="margin-top:4px; font-size:12px;">${i.items.map(it=>it.name+((it.qty||1)>1?' ×'+it.qty:'')).join('، ')}</div>
        </div>
        <div style="font-weight:800; color:var(--gold-l); white-space:nowrap;">${fmtMoney(i.total)}</div>
      </div>`).join('')}
    </div>
  </div>`;
};

/* ---------------- Init ---------------- */
window.onafterprint = ()=>{ document.getElementById('print-area').innerHTML=''; };
window.addEventListener('unhandledrejection', function(ev){
  console.error('Unhandled promise rejection:', ev.reason);
  try{ toast('خطأ غير متوقع: '+errMsg(ev.reason), 'err'); }catch(_){}
});
window.addEventListener('error', function(ev){
  console.error('Uncaught error:', ev.error||ev.message);
});
window.addEventListener('popstate', function(ev){
  if(!CUR) return; // not logged in / app not active — don't interfere with normal browser navigation
  if(PAGE !== 'dashboard'){
    PAGE = 'dashboard';
    PAGE_STATE = {};
    UI.renderShell();
    window.scrollTo(0,0);
  }
  // re-arm: consume this back-press by pushing a fresh entry, so the next
  // back-press is trapped the same way instead of leaving the app
  try{ history.pushState({bigbenTrap:true}, '', location.href); }catch(e){}
});
function updateTopbarClock(){
  const el = document.getElementById('topbar-clock');
  if(!el) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true});
  el.innerHTML = `<span class="tc-date">${dateStr}</span><span class="tc-time">${timeStr}</span>`;
}
function startTopbarClock(){
  updateTopbarClock();
  setInterval(updateTopbarClock, 1000);
}
(async function init(){
  UI.applyStoredTheme();
  startTopbarClock();
  if(!window.supabase){
    document.getElementById('session-checking').classList.add('hidden');
    document.getElementById('login-form-wrap').classList.remove('hidden');
    document.getElementById('login-error').textContent = 'تعذر تحميل مكتبة Supabase (تحقق من اتصال الإنترنت أو أي أداة حجب إعلانات قد تمنع jsdelivr.net)';
    document.getElementById('login-error').style.display='block';
    return;
  }
  await loadDB();
  document.getElementById('login-logo').innerHTML = UI.logoImg(40);
  const restored = await Auth.tryRestoreSession();
  if(restored){
    UI.enterApp();
  }else{
    document.getElementById('session-checking').classList.add('hidden');
    document.getElementById('login-form-wrap').classList.remove('hidden');
  }
})();
</script>
